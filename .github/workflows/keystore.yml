name: Create Keystore
on: workflow_dispatch
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        env:
          KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_PW" ]; then echo "need KEYSTORE_PASSWORD secret"; exit 1; fi
          keytool -genkeypair -v -keystore release.jks -storetype PKCS12 -alias xiangqi -keyalg RSA -keysize 2048 -validity 36500 -storepass "$KS_PW" -keypass "$KS_PW" -dname "CN=Teshoul, O=Divine Chinese Chess"
          base64 -w0 release.jks > keystore_base64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-base64
          path: keystore_base64.txt
          retention-days: 1
