name: Build APK
on: [workflow_dispatch, push]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate android folder only
        run: |
          flutter create --platforms=android --project-name chess_app /tmp/gen
          cp -r /tmp/gen/android ./android
          sed -i 's/android:label="[^"]*"/android:label="神的象棋"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/><application#' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release
      - name: Sign with fixed key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PW" ]; then
            echo "no fixed key configured, keep default signature"
            exit 0
          fi
          echo "$KS_B64" | base64 -d > /tmp/release.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks /tmp/release.jks --ks-key-alias xiangqi --ks-pass env:KS_PW --key-pass env:KS_PW build/app/outputs/flutter-apk/app-release.apk
          "$BT/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: chess-apk-v2
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Rename APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp build/app/outputs/flutter-apk/app-release.apk Xiangqi-${{ github.ref_name }}.apk
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Xiangqi-${{ github.ref_name }}.apk
          name: 神的象棋 ${{ github.ref_name }}
