name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate android folder only
        run: |
          flutter create --platforms=android --project-name chess_app /tmp/gen
          cp -r /tmp/gen/android ./android
          sed -i 's/android:label="[^"]*"/android:label="Teshoul象棋"/' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: chess-apk-v2
          path: build/app/outputs/flutter-apk/app-release.apk
